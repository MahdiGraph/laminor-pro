name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Lint for Firefox (web-ext)
        run: npm run lint
      - name: Build archives
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: laminor-pro
          path: dist/*
